<head>
	<style>
	</style>
</head>
<body>
<meta charset="utf-8">
<script>

let numberOfVariables = 0;
let cycles = 0;
let variables = [];
let selectedVariable = null;

let div = document.createElement(`div`);
div.id = `game`;
document.body.appendChild(div);

div = document.createElement(`textarea`);
div.id = `code`;
div.style.height = `200px`;
div.style.width = `800px`;
document.getElementById(`game`).appendChild(div);

function createBtn(text, parentId, handler) {
  const btn = document.createElement(`button`);
  btn.textContent = text;
  btn.addEventListener(`click`, handler);
  document.getElementById(parentId).appendChild(btn);
  return btn;
}

createBtn(`console.log`, `game`, print);
createBtn(`small text`, `game`, smallText);
createBtn(`new variable`, `game`, newVariable);
createBtn(`new cycle`, `game`, newCycle);
createBtn(`new if`, `game`, newIf);
createBtn(`ident`, `game`, ident);
createBtn(`delete last symbol`, `game`, deleteLastSymbol);
createBtn(`semicolon`, `game`, semicolon);
createBtn(`new line`, `game`, newLine);
createBtn(`semicolon and a new line`, `game`, semicolonAndANewLine);
createBtn(`copy`, `game`, copy);
createBtn(`space`, `game`, space);

div = document.createElement(`div`);
div.id = `numbers`;
document.getElementById(`game`).appendChild(div);

div = document.createElement(`div`);
div.id = `refactorDiv`;
document.getElementById(`game`).appendChild(div);

div = document.createElement(`label`);
div.textContent = `Refactor the Selected Variable With This: `;
document.getElementById(`game`).appendChild(div);

div = document.createElement(`input`);
div.id = `refactor`;
div.placeholder = `Выделите переменную и нажмите Enter`;
div.addEventListener(`keydown`, (e) => {
  if (e.key === `Enter`) applyRefactor();
});
div.addEventListener(`change`, applyRefactor);
document.getElementById(`game`).appendChild(div);

for (let i = 0; i < 10; i++) {
  createBtn(i, `numbers`, numbers);
}
createBtn(`+`, `numbers`, numbers);
createBtn(` + `, `numbers`, numbers);
createBtn(`-`, `numbers`, numbers);
createBtn(` - `, `numbers`, numbers);
createBtn(` * `, `numbers`, numbers);
createBtn(`**`, `numbers`, numbers);
createBtn(` / `, `numbers`, numbers);
createBtn(` < `, `numbers`, numbers);
createBtn(` > `, `numbers`, numbers);
createBtn(`=`, `numbers`, numbers);
createBtn(` = `, `numbers`, numbers);
createBtn(`==`, `numbers`, numbers);
createBtn(` == `, `numbers`, numbers);
createBtn(`!=`, `numbers`, numbers);
createBtn(` != `, `numbers`, numbers);
createBtn(`!==`, `numbers`, numbers);
createBtn(` !== `, `numbers`, numbers);
createBtn(`===`, `numbers`, numbers);
createBtn(` === `, `numbers`, numbers);
createBtn(`+=`, `numbers`, numbers);
createBtn(` += `, `numbers`, numbers);
createBtn(`-=`, `numbers`, numbers);
createBtn(` -= `, `numbers`, numbers);
createBtn(` ( `, `numbers`, numbers);
createBtn(` )`, `numbers`, numbers);
createBtn(` ()`, `numbers`, numbers);
createBtn(" (``)", `numbers`, numbers);
createBtn(` [ `, `numbers`, numbers);
createBtn(` ]`, `numbers`, numbers);
createBtn(` ], `, `numbers`, numbers);
createBtn(`[]`, `numbers`, numbers);
createBtn(`[], `, `numbers`, numbers);
createBtn(` { `, `numbers`, numbers);
createBtn(`}`, `numbers`, numbers);
createBtn(`}, `, `numbers`, numbers);
createBtn(`{}`, `numbers`, numbers);
createBtn(`{}, `, `numbers`, numbers);
createBtn(`!`, `numbers`, numbers);
createBtn(`?`, `numbers`, numbers);
createBtn(`.`, `numbers`, numbers);
createBtn(`,`, `numbers`, numbers);
createBtn(`, `, `numbers`, numbers);
createBtn(`|`, `numbers`, numbers);
createBtn(` | `, `numbers`, numbers);
createBtn(`||`, `numbers`, numbers);
createBtn(` || `, `numbers`, numbers);
createBtn(`&`, `numbers`, numbers);
createBtn(` & `, `numbers`, numbers);
createBtn(`&&`, `numbers`, numbers);
createBtn(` && `, `numbers`, numbers);
createBtn(`^`, `numbers`, numbers);
createBtn(` ^ `, `numbers`, numbers);
createBtn("continue", `numbers`, numbers);
createBtn("else", `numbers`, numbers);
createBtn("false", `numbers`, numbers);
createBtn(".includes()", `numbers`, numbers);
createBtn(`Infinity`, `numbers`, numbers);
createBtn(`.length`, `numbers`, numbers);
createBtn(`true`, `numbers`, numbers);

// --- Отслеживание выделения ---

const textareaEl = document.getElementById(`code`);

function checkSelection() {
  const selectedText = textareaEl.value.substring(textareaEl.selectionStart, textareaEl.selectionEnd).trim();
  if (variables.includes(selectedText)) {
    selectedVariable = selectedText;
  }
}

textareaEl.addEventListener(`mouseup`, checkSelection);
textareaEl.addEventListener(`keyup`, checkSelection);
textareaEl.addEventListener(`select`, checkSelection);

// --- Функция рефакторинга ---

function applyRefactor() {
  const refactorInput = document.getElementById(`refactor`);
  const newName = refactorInput.value.trim();

  if (!selectedVariable || !newName || selectedVariable === newName) {
    return;
  }

  const oldName = selectedVariable;

  // 1. Обновляем массив
  const varIndex = variables.indexOf(oldName);
  if (varIndex !== -1) {
    variables[varIndex] = newName;
  }

  // 2. Обновляем кнопку в #numbers
  const buttons = document.querySelectorAll(`#numbers button`);
  for (const btn of buttons) {
    if (btn.textContent === oldName) {
      btn.textContent = newName;
      break;
    }
  }

  // 3. Заменяем все вхождения переменной в коде
  const escapedOld = oldName.replace(/[.*+?^${}()|[\]\\]/g, `\\$&`);
  const regex = new RegExp(`(?<![\\p{L}\\p{N}_$])${escapedOld}(?![\\p{L}\\p{N}_$])`, `gu`);
  textareaEl.value = textareaEl.value.replace(regex, newName);

  selectedVariable = newName;
  refactorInput.value = ``;
  textareaEl.focus();
}

// --- Вспомогательные функции ---

function insertAtCursor(text) {
  textareaEl.setRangeText(text, textareaEl.selectionStart, textareaEl.selectionEnd, 'end');
  textareaEl.focus();
}

function print(event) {
  insertAtCursor("console.log(``);");
}

function smallText(event) {
  insertAtCursor(".toLowerCase()");
}

function newVariable(event) {
  const varName = `variable${++numberOfVariables}`;
  variables.push(varName);
  insertAtCursor(`let ${varName} = `);
  createBtn(varName, `numbers`, numbers);
}

function semicolon(event) {
  insertAtCursor(`;`);
}

function newLine(event) {
  insertAtCursor(`\n`);
}

function semicolonAndANewLine(event) {
  insertAtCursor(`;\n`);
}

function deleteLastSymbol(event) {
  const start = textareaEl.selectionStart;
  const end = textareaEl.selectionEnd;

  if (start !== end) {
    textareaEl.setRangeText('', start, end, 'end');
  } else if (start > 0) {
    textareaEl.setRangeText('', start - 1, start, 'end');
  }
  textareaEl.focus();
}

function newCycle(event) {
  const letter = String.fromCharCode(96 + ++cycles);
  variables.push(letter);
  insertAtCursor(`for ( let ${letter} = 0; ${letter} < 10; ${letter}++ ) {\n\n}`);
  createBtn(letter, `numbers`, numbers);
}

function newIf(event) {
  insertAtCursor(`if ( variable1 ) {\n\n}`);
}

function ident(event) {
  insertAtCursor(`    `);
}

function copy(event) {
  navigator.clipboard.writeText(textareaEl.value);
}

function space(event) {
  insertAtCursor(` `);
}

function numbers(event) {
  insertAtCursor(event.target.textContent);
}

</script>
</body>
