function shuffle(array) {
  let currentIndex = array.length;

  // While there remain elements to shuffle...
  while (currentIndex != 0) {

    // Pick a remaining element...
    let randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;

    // And swap it with the current element.
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
}

let phrases2 = phrases.split(/\d/gi);

}

function forward ( input ) {
    let resultsOfTheParallelUniverses = [];
    for ( let universeIndex = 0; universeIndex < numberOfParallelUniverses; universeIndex++ ) {
        let sum = biases[universeIndex];
        for ( let person = 0; person < numberOfPeople; person++ ) {
            sum += weights [ universeIndex * numberOfPeople + person ] * input [ person ];
        }
        let result = 1 / ( 1 + Math.exp(-sum));
        resultsOfTheParallelUniverses.push(result);
    }
    let trends = [];
    for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {
        let sum = biases[numberOfParallelUniverses + archivariusIndex];
        for ( let universeIndex = 0; universeIndex < numberOfParallelUniverses; universeIndex++ ) {
            sum += weights [ numberOfParallelUniverses * numberOfPeople + archivariusIndex * numberOfParallelUniverses + universeIndex ] * resultsOfTheParallelUniverses[universeIndex];
        }
        let result = 1 / ( 1 + Math.exp(-sum));
        trends.push(result);
    }    
    let probabilities = [];
    let sumExp = 0;
    for ( let oracleIndex = 0; oracleIndex < numberOfOracles; oracleIndex++ ) {
        let sum = biases[numberOfParallelUniverses + numberOfArchivariuses + oracleIndex];
        for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {
            sum += weights [ numberOfParallelUniverses * numberOfPeople + numberOfArchivariuses * numberOfParallelUniverses + oracleIndex * numberOfArchivariuses + archivariusIndex ] * trends[archivariusIndex];
        }
        let result = Math.exp(sum);
        probabilities.push(result);
        sumExp += result;
    }
    for ( let oracleIndex = 0; oracleIndex < numberOfOracles; oracleIndex++ ) probabilities[oracleIndex] /= sumExp;
    
    return [ resultsOfTheParallelUniverses, trends, probabilities ];
}


function backpropagation(input, output) {
    let [ resultsOfTheParallelUniverses, trends, probabilities ] = forward(input);
	
	let loss = -Math.log(probabilities[output.indexOf(1)] + 1e-15);
    let oracleDeltas = [];
    for ( let oracleIndex = 0; oracleIndex < numberOfOracles; oracleIndex++ ) {
        oracleDeltas.push( probabilities[oracleIndex] - output[oracleIndex] );
		
        biases[numberOfParallelUniverses + numberOfArchivariuses + oracleIndex] -= learningRate * oracleDeltas[oracleIndex];
        
    }
    let archivariusDeltas = [];
    for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {		
		
        let error = 0;
        for ( let oracleIndex = 0; oracleIndex < numberOfOracles; oracleIndex++ ) {
            error += oracleDeltas[oracleIndex] * weights[numberOfParallelUniverses * numberOfPeople + numberOfArchivariuses * numberOfParallelUniverses + oracleIndex * numberOfArchivariuses + archivariusIndex];
                
        }
        archivariusDeltas.push( error * trends[archivariusIndex] * ( 1 - trends[archivariusIndex] ) );
		
		biases[numberOfParallelUniverses + archivariusIndex] -= learningRate * archivariusDeltas[archivariusIndex];		
		
    }
    let universeDeltas = [];
    for ( let universeIndex = 0; universeIndex < numberOfParallelUniverses; universeIndex++ ) {
		
        let error = 0;
        for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {
            error += archivariusDeltas[archivariusIndex] * weights[numberOfParallelUniverses * numberOfPeople + archivariusIndex * numberOfParallelUniverses + universeIndex];
        }
		universeDeltas.push( error * resultsOfTheParallelUniverses[universeIndex] * ( 1 - resultsOfTheParallelUniverses[universeIndex] ) );
		
		biases[universeIndex] -= learningRate * universeDeltas[universeIndex];		
		
	}
	
	for ( let oracleIndex = 0; oracleIndex < numberOfOracles; oracleIndex++ ) {
		
		for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {
			
			weights[numberOfPeople * numberOfParallelUniverses + numberOfParallelUniverses * numberOfArchivariuses + oracleIndex * numberOfArchivariuses + archivariusIndex] -= learningRate * oracleDeltas[oracleIndex] * trends[archivariusIndex];
			
		}
		
	}
	
	for ( let archivariusIndex = 0; archivariusIndex < numberOfArchivariuses; archivariusIndex++ ) {
		
		for ( let universeIndex = 0; universeIndex < numberOfParallelUniverses; universeIndex++ ) {
			
			weights[numberOfPeople * numberOfParallelUniverses + archivariusIndex * numberOfParallelUniverses + universeIndex ] -= learningRate * archivariusDeltas[archivariusIndex] * resultsOfTheParallelUniverses[universeIndex];
			
		}
		
	}
	
	for ( let universeIndex = 0; universeIndex < numberOfParallelUniverses; universeIndex++ ) {
		
		for ( let peopleIndex = 0; peopleIndex < numberOfPeople; peopleIndex++ ) {
			
			weights[universeIndex * numberOfPeople + peopleIndex ] -= learningRate * universeDeltas[universeIndex] * input[peopleIndex];
			
		}
		
	}
	
	return loss;
	
}
